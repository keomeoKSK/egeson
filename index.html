let a={};let current=0;
const icon=(name)=>I[name]||I.sun;
function selected(v,id){return a[id]===v||(Array.isArray(a[id])&&a[id].includes(v))}
function visible(){return steps}
function renderProgress(){const p=document.getElementById('progress');p.innerHTML=steps.map((_,i)=>`<i class="${i<=current?'active':''}"></i>`).join('');document.getElementById('stepLabel').textContent=steps[current].name;document.getElementById('stepCount').textContent=`${current+1} / ${steps.length}`}
function select(id,v){
  a[id]=v;
  const buttons=document.querySelectorAll('.opt');
  buttons.forEach(btn=>btn.classList.toggle('selected',btn.dataset.v===v));
  setTimeout(()=>{current++;render()},360);
}
function toggle(id,v){
  let x=Array.isArray(a[id])?a[id]:[];
  if(v==='none') x=['none'];
  else {x=x.filter(z=>z!=='none');x=x.includes(v)?x.filter(z=>z!==v):[...x,v];}
  a[id]=x;
  document.querySelectorAll('.opt').forEach(btn=>btn.classList.toggle('selected',x.includes(btn.dataset.v)));
  const next=document.getElementById('next'); if(next) next.disabled=x.length===0;
}
function render(){
  renderProgress();
  const s=steps[current],b=document.getElementById('body');
  if(s.type==='single'){
    b.innerHTML=`<h2 class="qtitle">${s.title}</h2><p class="qsub">${s.sub}</p><div class="options">${s.opts.map(o=>`<button type="button" class="opt ${selected(o[3],s.id)?'selected':''}" data-v="${o[3]}"><span class="icon">${icon(o[0])}</span><span class="opttext"><strong>${o[1]}</strong>${o[2]?`<span>${o[2]}</span>`:''}</span><span class="mark"></span></button>`).join('')}</div><div class="actions"><button type="button" class="btn back" id="back">← Geri</button><span></span></div>`;
    b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>select(s.id,x.dataset.v));
  } else if(s.type==='multi'){
    const vals=Array.isArray(a[s.id])?a[s.id]:[];
    b.innerHTML=`<h2 class="qtitle">${s.title}</h2><p class="qsub">${s.sub}</p><div class="options">${s.opts.map(o=>`<button type="button" class="opt ${vals.includes(o[3])?'selected':''}" data-v="${o[3]}"><span class="icon">${icon(o[0])}</span><span class="opttext"><strong>${o[1]}</strong>${o[2]?`<span>${o[2]}</span>`:''}</span><span class="mark"></span></button>`).join('')}</div><div class="multi-note">Birden fazla seçenek seçebilirsiniz.</div><div class="actions"><button type="button" class="btn back" id="back">← Geri</button><button type="button" class="btn primary" id="next" ${vals.length?'':'disabled'}>Devam et →</button></div>`;
    b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>toggle(s.id,x.dataset.v));
    document.getElementById('next').onclick=()=>{if((a[s.id]||[]).length){current++;render()}};
  } else {
    b.innerHTML=`<h2 class="qtitle">${s.title}</h2><p class="qsub">${s.sub}</p><div class="field"><label>Ad Soyad</label><input id="name" placeholder="Adınız Soyadınız" value="${a.name||''}"></div><div class="field"><label>Telefon / WhatsApp</label><input id="phone" type="tel" placeholder="05XX XXX XX XX" value="${a.phone||''}"></div><div class="field"><label>E-posta adresi <span style="font-weight:400;color:#8A949D">(isteğe bağlı)</span></label><input id="email" type="email" placeholder="ornek@email.com" value="${a.email||''}"></div><div class="emailnote">Ön hesaplama teklif özetini e-posta ile almak istiyorsanız e-posta adresinizi ekleyin.</div><div class="actions"><button type="button" class="btn back" id="back">← Geri</button><button type="button" class="btn primary" id="result">Sonucu gör →</button></div>`;
    document.getElementById('result').onclick=()=>{a.name=document.getElementById('name').value.trim();a.phone=document.getElementById('phone').value.trim();a.email=document.getElementById('email').value.trim();renderResult()};
  }
  document.getElementById('back').onclick=()=>{if(current>0){current--;render()}};
}
function calculate(){let monthly=BILL[a.bill]||300;const loads=a.loads||[];if(loads.includes('ac'))monthly+=80;if(loads.includes('water'))monthly+=70;if(loads.includes('pool'))monthly+=120;if(loads.includes('car'))monthly+=180;let annual=monthly*12;let shade={sunny:1,partial:.93,shade:.82,unknown:.95}[a.roof]||.95;let y=CONFIG.yieldPerKwpBase*shade;let kwp=Math.max(annual/y,3);if(a.roofsize==='small')kwp=Math.min(kwp,5.5);kwp=Math.round(kwp*2)/2;let panels=Math.ceil(kwp*1000/CONFIG.panelWattage);let actual=panels*CONFIG.panelWattage/1000;let production=Math.round(actual*y);let battery=0;if(a.battery==='yes')battery=5;if(a.battery==='maybe')battery=5;if(loads.includes('car')&&a.battery==='yes')battery=10;if(loads.includes('pool')&&a.battery==='yes')battery=Math.max(battery,10);let self=a.battery==='yes'?70:45;if(a.battery==='maybe')self=55;let savings=Math.round(production*(self/100)*CONFIG.elecPriceTLperKwh+(production*(1-self/100))*CONFIG.elecPriceTLperKwh*CONFIG.exportCreditFactor);let investment=Math.round(actual*CONFIG.costPerKwpTL+battery*CONFIG.batteryCostPerKwhTL);return{monthly,actual,panels,production,battery,self,savings,investment,payback:investment/savings}}
function money(n){return n.toLocaleString('tr-TR')+' TL'}
function renderResult(){
 const r=calculate();
 document.getElementById('progress').innerHTML=steps.map(()=>'<i class="active"></i>').join('');
 document.getElementById('stepLabel').textContent='Solar öneriniz';
 document.getElementById('stepCount').textContent='✓ Tamamlandı';
 const b=document.getElementById('body');
 const loads=(a.loads||[]).filter(x=>x!=='none').join(', ')||'Standart tüketim';
 const offerText=`EgeSon Solar Ön Teklif\n\nMüşteri: ${a.name||'-'}\nTelefon: ${a.phone||'-'}\nE-posta: ${a.email||'-'}\n\nÖnerilen sistem: ${r.actual} kWp\nPanel: ${r.panels} × ${CONFIG.panelWattage} W\nTahmini yıllık üretim: ${r.production.toLocaleString('tr-TR')} kWh\nTahmini yıllık tasarruf: ${money(r.savings)}\nBatarya: ${r.battery?r.battery+' kWh':'Önerilmedi'}\nÖngörülen öz tüketim: %${r.self}\nTahmini geri ödeme: ${r.payback.toFixed(1)} yıl\n\nTüketim kaynakları: ${loads}\n\nBu belge ön hesaplamadır. Kesin sistem boyutu, fiyat ve tasarruf hesabı ücretsiz keşif sonrasında hazırlanır.`;
 const mailSubject=encodeURIComponent('EgeSon Solar Ön Teklif');
 const customerBody=encodeURIComponent(`Merhaba ${a.name||''},\n\nEgeSon ön hesaplama sonuçlarınız aşağıdadır:\n\nÖnerilen sistem: ${r.actual} kWp\nTahmini yıllık üretim: ${r.production.toLocaleString('tr-TR')} kWh\nTahmini yıllık tasarruf: ${money(r.savings)}\nBatarya: ${r.battery?r.battery+' kWh':'Önerilmedi'}\n\nBu sonuç ön hesaplamadır. Kesin teklif ücretsiz keşif sonrasında hazırlanır.\n\nEgeSon`);
 const leadBody=encodeURIComponent(`Yeni EgeSon Solar Talebi\n\nAd: ${a.name||'-'}\nTelefon: ${a.phone||'-'}\nE-posta: ${a.email||'-'}\n\nÖnerilen sistem: ${r.actual} kWp\nÜretim: ${r.production.toLocaleString('tr-TR')} kWh/yıl\nTasarruf: ${money(r.savings)}\nBatarya: ${r.battery?r.battery+' kWh':'Önerilmedi'}\nTüketim kaynakları: ${loads}`);
 const customerMail=a.email?`mailto:${a.email}?subject=${mailSubject}&body=${customerBody}`:'#';
 const leadMail=`mailto:${CONFIG.leadEmail}?subject=${encodeURIComponent('Yeni EgeSon Solar Talebi')}&body=${leadBody}`;
 b.innerHTML=`<div class="result"><div class="small">Önerilen sistem</div><div class="big">${r.actual}<span> kWp</span></div><p>${r.panels} × ${CONFIG.panelWattage} W panel · Ege bölgesi ön tahmini</p><div class="resultgrid"><div class="rstat"><strong>${r.production.toLocaleString('tr-TR')} kWh</strong><span>Yıllık üretim</span></div><div class="rstat"><strong>${money(r.savings)}</strong><span>Yıllık tasarruf*</span></div><div class="rstat"><strong>${r.battery?r.battery+' kWh':'—'}</strong><span>Batarya</span></div></div></div><div class="resultcards"><div class="cardstat"><div class="ic">${I.sun}</div><strong>%${r.self}</strong><span>Öngörülen öz tüketim</span></div><div class="cardstat"><div class="ic">${I.leaf}</div><strong>${r.payback.toFixed(1)} yıl</strong><span>Tahmini geri ödeme süresi*</span></div></div><div class="offerbox" id="offer"><h3>Ön teklif özeti</h3><div class="offerline"><span>Sistem</span><strong>${r.actual} kWp · ${r.panels} panel</strong></div><div class="offerline"><span>Yıllık üretim</span><strong>${r.production.toLocaleString('tr-TR')} kWh</strong></div><div class="offerline"><span>Yıllık tasarruf*</span><strong>${money(r.savings)}</strong></div><div class="offerline"><span>Batarya</span><strong>${r.battery?r.battery+' kWh':'Önerilmedi'}</strong></div><div class="offer-actions"><button type="button" class="btn secondary" id="printOffer">🖨 Ön teklifi kaydet</button><a class="btn primary" style="text-align:center;text-decoration:none" href="${customerMail}" ${a.email?'':'aria-disabled="true"'}>✉ E-posta ile gönder</a></div>${a.email?'<div class="emailnote">E-posta uygulamanız açılır ve teklif özeti hazır olarak gelir. Göndermeden önce kontrol edebilirsiniz.</div>':'<div class="emailnote">E-posta ile almak için bir önceki adımda e-posta adresinizi ekleyin.</div>'}</div><details><summary>Hesaplama hakkında</summary><div class="tech">Bu sonuç, verdiğiniz bilgiler ve Ege bölgesi için kullanılan genel üretim varsayımlarına göre hazırlanmış bir ön hesaplamadır. Çatı yönü, gölge, elektrik tarifesi ve gerçek tüketim yerinde keşifte netleştirilir.</div></details><p class="notice">* Tasarruf ve geri ödeme süresi gösterge niteliğindedir. Kesin sistem boyutu, fiyat ve tasarruf hesabı ücretsiz keşif sonrasında hazırlanır.</p><a class="wa" href="https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(`Merhaba EgeSon, ücretsiz keşif talep ediyorum.\n\nÖn hesaplama: ${r.actual} kWp · ${r.panels} panel · ${r.production.toLocaleString('tr-TR')} kWh/yıl\nBatarya: ${r.battery?r.battery+' kWh':'Önerilmedi'}\nAd: ${a.name||'-'}\nTelefon: ${a.phone||'-'}`)}" target="_blank" rel="noopener">WhatsApp ile ücretsiz keşif talep edin</a><div class="restart"><button id="restart">Baştan başla</button></div>`;
 document.getElementById('printOffer').onclick=()=>{const old=document.title;document.title='EgeSon Solar Ön Teklif';window.print();document.title=old};
 document.getElementById('restart').onclick=()=>{a={};current=0;render()};
 // Optional lead mail for EgeSon team is available for deployment/configuration.
 window.egesonLeadMail=leadMail;
 window.egesonOfferText=offerText;
}

render();
</script></body></html>
